# Run the agents locally from this directory: agentframe dev
# Set AGENTFRAME_OLLAMA_MODEL to an installed tag, such as llama3.2:3b, for
# briefs and plans.
# The research agent is listed first, since the planner checks at startup
# that it can reach it.
agents:
  research-agent:
    app: research:create_app
    port: 8001
  writer-agent:
    app: writer:create_app
    port: 8004
  planner:
    app: planner:create_app
    port: 8002
