[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agentframe-py"
version = "0.1.0"
description = "Define agents with Python. Communicate through A2A. Choose your model host."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Malcolm Miller" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "pydantic>=2.14,<3",
    "starlette==1.10.0",
]

[project.optional-dependencies]
server = ["uvicorn==0.54.0"]
ollama = [
    "ollama==0.6.3",
]
foundry = [
    "aiohttp==3.14.5",
    "azure-identity==1.27.0",
    "openai==3.49.0",
]
entra = [
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
]

[project.scripts]
agentframe = "agentframe.cli:main"

[project.urls]
Repository = "https://github.com/malcmiller/agentframe"

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pre-commit==4.7.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    # Imported directly by the tests, so pinned rather than left transitive.
    "httpx2==2.16.0",
    "azure-core==1.41.0",
    "agentframe-py[ollama,foundry,entra]",
]

# The distribution is agentframe-py; the import package stays agentframe.
[tool.hatch.build.targets.wheel]
packages = ["src/agentframe"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "tests/support", "."]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the runnable examples, and the
# shared test helpers in tests/support (imported as top-level modules).
pythonpath = [".", "tests/support"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "ollama: calls a real Ollama server; runs only with AGENTFRAME_TEST_OLLAMA=1",
    "foundry: calls a real Foundry deployment; runs only with AGENTFRAME_TEST_FOUNDRY=1",
    "entra: uses a real Microsoft Entra token; runs only with AGENTFRAME_TEST_ENTRA=1",
]
