[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agentframe-py"
version = "0.3.0"
description = "Define agents with Python. Communicate through A2A. Choose your model host."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Malcolm Miller" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
# Compatible ranges: the lowest tested version up to the next breaking release
# (next major, or next minor for 0.x packages). CI's lowest-deps job tests the
# lower bounds; uv.lock pins the versions the other jobs test.
dependencies = [
    "a2a-sdk[http-server]>=1.3.0,<2",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14.2,<3",
    "pyyaml>=6.0.3,<7",
    "starlette>=1.10.0,<2",
]

[project.optional-dependencies]
server = ["uvicorn>=0.54.0,<0.55"]
ollama = [
    "ollama>=0.6.3,<0.7",
]
anthropic = [
    "anthropic>=2.8.0,<3",
]
foundry = [
    "aiohttp>=3.14.5,<4",
    "azure-ai-projects>=2.11.0,<3",
    "azure-identity>=1.27.0,<2",
    "openai>=3.49.0,<4",
]
entra = [
    "aiohttp>=3.14.5,<4",
    "azure-identity>=1.27.0,<2",
    "httpx>=0.28.1,<0.29",
    "pyjwt[crypto]>=2.15.1,<3",
]
mcp = ["mcp>=2.3.0,<3"]
redis = ["redis>=8.1.0,<9"]
# The API only: the application installs and configures the SDK and exporters.
otel = ["opentelemetry-api>=1.45.2,<2"]
ag-ui = ["ag-ui-protocol>=1.0.0,<2"]

[project.scripts]
agentframe = "agentframe.cli:main"

[project.urls]
Repository = "https://github.com/malcmiller/agentframe"
Documentation = "https://github.com/malcmiller/agentframe/tree/main/docs"
Changelog = "https://github.com/malcmiller/agentframe/blob/main/CHANGELOG.md"
Issues = "https://github.com/malcmiller/agentframe/issues"

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "coverage==7.17.3",
    "pre-commit==4.7.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    # Imported directly by the tests, so pinned rather than left transitive.
    "httpx2==2.16.0",
    "azure-core==1.41.0",
    "agentframe-py[ollama,foundry,anthropic,entra,mcp,redis,otel,ag-ui]",
    # Tests RedisMessageDedupStore against redis-py without a Redis server.
    "fakeredis==2.40.0",
    # The tests record spans and metrics with the SDK's in-memory exporters.
    "opentelemetry-sdk==1.45.2",
    "types-pyyaml==6.0.12.20261113",
]

# The distribution is agentframe-py; the import package stays agentframe.
[tool.hatch.build.targets.wheel]
packages = ["src/agentframe"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "tests/support", "."]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]
warn_unreachable = true

[tool.coverage.run]
source_pkgs = ["agentframe"]
# Tests start agents and the CLI as separate Python processes; measure those
# too. Each process writes its own data file, merged by `coverage combine`.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the runnable examples, and the
# shared test helpers in tests/support (imported as top-level modules).
pythonpath = [".", "tests/support"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
# An unclosed resource fails the suite. Most ResourceWarnings are raised in
# __del__, where an error cannot propagate; pytest reports those as
# unraisable exception warnings, so they are errors too. Because of garbage
# collection timing, the failure can name a later test than the one that
# leaked; run with PYTHONTRACEMALLOC=20 to see where the resource was created.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "ollama: calls a real Ollama server; runs only with AGENTFRAME_TEST_OLLAMA=1",
    "foundry: calls real Foundry; runs only with AGENTFRAME_TEST_FOUNDRY=1 (models) or AGENTFRAME_TEST_FOUNDRY_AGENTS=1 (agents registry)",
    "anthropic: calls the real Anthropic API; runs only with AGENTFRAME_TEST_ANTHROPIC=1",
    "openai: calls plain OpenAI through FoundryModel; runs only with AGENTFRAME_TEST_OPENAI=1",
    "entra: uses a real Microsoft Entra token; runs only with AGENTFRAME_TEST_ENTRA=1",
    "docker: builds and runs containers; runs only with AGENTFRAME_TEST_DOCKER=1",
    "benchmark: measures overhead and throughput; runs only with AGENTFRAME_BENCHMARK=1",
]
