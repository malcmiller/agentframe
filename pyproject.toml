[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agentframe"
version = "0.1.0.dev0"
description = "Define agents with Python. Communicate through A2A. Choose your model host."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Malcolm Miller" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "pydantic>=2.14,<3",
]

[project.optional-dependencies]
server = ["uvicorn==0.54.0"]

[project.scripts]
agentframe = "agentframe.cli:main"

[project.urls]
Repository = "https://github.com/malcmiller/agentframe"

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pre-commit==4.7.0",
    "uvicorn==0.54.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
