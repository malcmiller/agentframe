# Generated by `agentframe compose` from agentframe.yaml.
# DEVELOPMENT ONLY: AGENTFRAME_DEV=1 enables development API keys and plain
# http between containers. Do not deploy this file; production needs real
# authentication, HTTPS and secrets kept outside images.
# Set every ${...} variable below in a .env file next to this file; keys are
# never written here.
services:
  research-agent:
    build: .
    command:
    - agentframe
    - run
    - myapp.research:create_app
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    ports:
    - 127.0.0.1:8001:8001
    environment:
      AGENTFRAME_DEV: '1'
      AGENTFRAME_PUBLIC_URL: http://research-agent:8001
      AGENTFRAME_AGENTS: research-agent=http://research-agent:8001/.well-known/agent-card.json,planner=http://planner:8002/.well-known/agent-card.json
      AGENTFRAME_ALLOW_HTTP_HOSTS: research-agent,planner
      AGENTFRAME_DEV_API_KEYS: planner=${PLANNER_API_KEY:?set PLANNER_API_KEY in .env},developer=${AGENTFRAME_DEV_CLIENT_KEY:?set AGENTFRAME_DEV_CLIENT_KEY in .env}
      AGENTFRAME_DEV_REMOTE_KEYS: planner=${RESEARCH_AGENT_API_KEY:?set RESEARCH_AGENT_API_KEY in .env}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')
      interval: 2s
      timeout: 2s
      retries: 15
    stop_grace_period: 35s
  planner:
    build: .
    command:
    - agentframe
    - run
    - myapp.planner:create_app
    - --host
    - 0.0.0.0
    - --port
    - '8002'
    ports:
    - 127.0.0.1:8002:8002
    environment:
      AGENTFRAME_DEV: '1'
      AGENTFRAME_PUBLIC_URL: http://planner:8002
      AGENTFRAME_AGENTS: research-agent=http://research-agent:8001/.well-known/agent-card.json,planner=http://planner:8002/.well-known/agent-card.json
      AGENTFRAME_ALLOW_HTTP_HOSTS: research-agent,planner
      AGENTFRAME_DEV_API_KEYS: research-agent=${RESEARCH_AGENT_API_KEY:?set RESEARCH_AGENT_API_KEY in .env},developer=${AGENTFRAME_DEV_CLIENT_KEY:?set AGENTFRAME_DEV_CLIENT_KEY in .env}
      AGENTFRAME_DEV_REMOTE_KEYS: research-agent=${PLANNER_API_KEY:?set PLANNER_API_KEY in .env}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready')
      interval: 2s
      timeout: 2s
      retries: 15
    stop_grace_period: 35s
    depends_on:
      research-agent:
        condition: service_healthy
