name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
      - run: uv build
      - name: Import the installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --isolated --no-project --python 3.13
          --with "${GITHUB_WORKSPACE}"/dist/*.whl
          python -c "import agentframe; print(agentframe.__version__)"
